apiVersion: v1
kind: Pod
metadata:
  name: unsafe-demo
spec:
  hostNetwork: true
  automountServiceAccountToken: true
  containers:
    - name: app
      image: nginx:latest
      securityContext:
        privileged: true
        runAsUser: 0
        allowPrivilegeEscalation: true
        readOnlyRootFilesystem: false
