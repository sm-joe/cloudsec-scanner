[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsec-scanner"
version = "0.1.0"
description = "Standalone infrastructure-as-code and supply-chain security scanner CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Cloud Security Scanner contributors" }]
dependencies = ["PyYAML>=6.0.2,<7", "python-hcl2>=7.3,<8", "cvss>=3.4,<4", "packageurl-python>=0.16,<1"]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
dev = ["pytest>=8.0,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[project.urls]
Repository = "https://github.com/sm-joe/cloudsec-scanner"
Issues = "https://github.com/sm-joe/cloudsec-scanner/issues"

[project.scripts]
cloudsec = "cloudsec_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "F401"]
select = ["E", "F"]
