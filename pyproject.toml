[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsec-scanner"
version = "0.1.0"
description = "Extensible cloud security misconfiguration scanner CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Cloud Security Scanner contributors" }]
dependencies = ["PyYAML>=6.0.2,<7", "python-hcl2>=7.3,<8"]

[project.optional-dependencies]
aws = ["boto3>=1.35,<2"]
dev = ["pytest>=8.0,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]

[project.scripts]
cloudsec = "cloudsec_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["E501", "F401"]
select = ["E", "F"]
