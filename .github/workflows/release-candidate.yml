name: CLI Release Candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build twine cyclonedx-bom pip-audit
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Fresh installation smoke test
        run: python scripts/verify_wheel.py
      - name: Inventory runtime dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cloudsec-release"
          "$RUNNER_TEMP/cloudsec-release/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cloudsec-release/bin/python" -m pip install dist/*.whl
          cyclonedx-py environment "$RUNNER_TEMP/cloudsec-release/bin/python" --output-format JSON --output-file dist/runtime-sbom.json
      - name: Audit installed core and AWS runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cloudsec-aws"
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          "$RUNNER_TEMP/cloudsec-aws/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cloudsec-aws/bin/python" -m pip install "${wheel}[aws]"
          for profile in cloudsec-release cloudsec-aws; do
            environment="$RUNNER_TEMP/$profile"
            "$environment/bin/python" -m pip check
            # Audit installed dependencies, excluding only the unpublished local
            # project itself. Do not silently skip any third-party package.
            "$environment/bin/python" -m pip list --format=json > "$RUNNER_TEMP/$profile-packages.json"
            python scripts/runtime_requirements.py "$RUNNER_TEMP/$profile-packages.json" > "$RUNNER_TEMP/$profile-requirements.txt"
            echo "Auditing $profile"
            cat "$RUNNER_TEMP/$profile-requirements.txt"
            pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/$profile-requirements.txt" --format json --output "$RUNNER_TEMP/$profile-audit.json" || {
              if [[ -f "$RUNNER_TEMP/$profile-audit.json" ]]; then cat "$RUNNER_TEMP/$profile-audit.json"; fi
              exit 1
            }
          done
      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudsec-runtime-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cloudsec-*-requirements.txt
            ${{ runner.temp }}/cloudsec-*-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz runtime-sbom.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify candidate license and checksums
        run: python scripts/verify_release_artifacts.py
      - uses: actions/upload-artifact@v7
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist
      - name: Check downloaded candidate checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/runtime-sbom.json
            dist/SHA256SUMS

  publish-stable:
    # The initial stable release is explicitly authorized. Never publish from a PR,
    # a fork, a manual dispatch, or an unverified/rebuilt artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sm-joe/cloudsec-scanner'
    needs: [package, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cloudsec-stable-v0.1.0
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check publication state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          # List the specific tag through a successful API request. Authorization
          # and network failures must not be mistaken for "release absent".
          state="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.1.0") | [.draft,.prerelease] | @tsv')"
          if [[ "$state" == $'false\tfalse' ]]; then
            echo "Stable release already exists; no mutation."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif [[ -n "$state" ]]; then
            echo "Existing draft or prerelease requires explicit review." >&2
            exit 1
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.state.outputs.publish == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact-main security and portability gates
        if: steps.state.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wait_release_gates.py
      - uses: actions/download-artifact@v7
        if: steps.state.outputs.publish == 'true'
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist
      - name: Verify exact candidate before publishing
        if: steps.state.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_artifacts.py
          for artifact in dist/*.whl dist/*.tar.gz dist/runtime-sbom.json dist/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GH_REPO" --source-ref refs/heads/main --source-digest "$RELEASE_SHA" --signer-workflow "$GH_REPO/.github/workflows/release-candidate.yml"
          done
      - name: Publish stable v0.1.0
        if: steps.state.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Only the current main head may publish. Refuse preexisting tags.
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          [[ "$current" == "$RELEASE_SHA" ]]
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v0.1.0" --jq '.[] | select(.ref == "refs/tags/v0.1.0") | .ref')"
          [[ -z "$refs" ]]
          gh release create v0.1.0 --target "$RELEASE_SHA" --title "CloudSec Scanner v0.1.0" --notes-file docs/releases/v0.1.0.md --latest dist/*.whl dist/*.tar.gz dist/runtime-sbom.json dist/SHA256SUMS
          gh release view v0.1.0 --json tagName,isDraft,isPrerelease,assets,url

  refresh-initial-release:
    # One-time owner-authorized refresh of the original v0.1.0 only.
    # The original tag and exact release asset digests are the authorization guard.
    # Once the tag moves, subsequent pushes cannot replace this release.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sm-joe/cloudsec-scanner'
    needs: [package, attest, publish-stable]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cloudsec-stable-v0.1.0
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
      ORIGINAL_SHA: 673d2565a8f7529ac151eaeef3e8ed5459679e80
    steps:
      - name: Check one-time refresh eligibility
        id: eligibility
        shell: bash
        run: |
          set -euo pipefail
          original="$(gh api "repos/$GH_REPO/git/ref/tags/v0.1.0" --jq .object.sha)"
          if [[ "$original" != "$ORIGINAL_SHA" ]]; then
            echo 'refresh=false' >> "$GITHUB_OUTPUT"
            echo "Original tag no longer present; no release mutation."
          else
            echo 'refresh=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.eligibility.outputs.refresh == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact-main security and portability
        if: steps.eligibility.outputs.refresh == 'true'
        run: python scripts/wait_release_gates.py
      - uses: actions/download-artifact@v7
        if: steps.eligibility.outputs.refresh == 'true'
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist
      - name: Verify new distributions and signed provenance
        if: steps.eligibility.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_artifacts.py
          for artifact in dist/*.whl dist/*.tar.gz dist/runtime-sbom.json dist/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GH_REPO" --source-ref refs/heads/main --source-digest "$RELEASE_SHA" --signer-workflow "$GH_REPO/.github/workflows/release-candidate.yml"
          done
      - name: Back up and verify original release
        if: steps.eligibility.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p original-release
          gh api "repos/$GH_REPO/releases/tags/v0.1.0" > original-release/release.json
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("original-release/release.json").read_text())
          assert release["id"] == 452758021 and not release["draft"] and not release["prerelease"] and release.get("immutable") is False
          assert release["target_commitish"] == "673d2565a8f7529ac151eaeef3e8ed5459679e80"
          expected = {
              "cloudsec_scanner-0.1.0-py3-none-any.whl": "62d283794505fa5d401694df117493be3c7383e7dbd88c75047e645102936ece",
              "cloudsec_scanner-0.1.0.tar.gz": "483c68a1135fbf0922702b1f1760de03fcd9b1bc7a7f5a2a694f77c32c6d8000",
              "runtime-sbom.json": "b1b3921b35495a457a013f1cbf2ef026bf4bf133b0ea497bfbf852c191add0f3",
              "SHA256SUMS": "3ec147b9f02f0c042e5ac5200c0d7792afcec37e7b87e09ebf1f5e6d91390dea",
          }
          assert {a["name"]: a["digest"] for a in release["assets"]} == {name: "sha256:" + digest for name, digest in expected.items()}
          Path("original-release/notes.md").write_text(release["body"], encoding="utf-8")
          Path("original-release/original-digests.txt").write_text("".join(f"{digest}  {name}\n" for name, digest in expected.items()), encoding="utf-8")
          PY
          gh release download v0.1.0 --dir original-release --pattern '*'
          (cd original-release && sha256sum -c original-digests.txt && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: steps.eligibility.outputs.refresh == 'true'
        with:
          name: original-v0.1.0-before-terminal-refresh
          path: original-release/
          if-no-files-found: error
          retention-days: 90
      - name: Refresh the existing stable release exactly once
        if: steps.eligibility.outputs.refresh == 'true'
        shell: bash
        run: bash scripts/refresh_initial_release.sh
