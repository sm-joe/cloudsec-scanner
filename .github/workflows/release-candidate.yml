name: CLI Release Candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build twine cyclonedx-bom pip-audit
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Fresh installation smoke test
        run: python scripts/verify_wheel.py
      - name: Inventory runtime dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cloudsec-release"
          "$RUNNER_TEMP/cloudsec-release/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cloudsec-release/bin/python" -m pip install dist/*.whl
          cyclonedx-py environment "$RUNNER_TEMP/cloudsec-release/bin/python" --output-format JSON --output-file dist/runtime-sbom.json
      - name: Audit installed core and AWS runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cloudsec-aws"
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          "$RUNNER_TEMP/cloudsec-aws/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/cloudsec-aws/bin/python" -m pip install "${wheel}[aws]"
          for profile in cloudsec-release cloudsec-aws; do
            environment="$RUNNER_TEMP/$profile"
            "$environment/bin/python" -m pip check
            # Audit installed dependencies, excluding only the unpublished local
            # project itself. Do not silently skip any third-party package.
            "$environment/bin/python" -m pip list --format=json > "$RUNNER_TEMP/$profile-packages.json"
            python scripts/runtime_requirements.py "$RUNNER_TEMP/$profile-packages.json" > "$RUNNER_TEMP/$profile-requirements.txt"
            echo "Auditing $profile"
            cat "$RUNNER_TEMP/$profile-requirements.txt"
            pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/$profile-requirements.txt" --format json --output "$RUNNER_TEMP/$profile-audit.json" || {
              if [[ -f "$RUNNER_TEMP/$profile-audit.json" ]]; then cat "$RUNNER_TEMP/$profile-audit.json"; fi
              exit 1
            }
          done
      - name: Preserve dependency audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudsec-runtime-audit-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cloudsec-*-requirements.txt
            ${{ runner.temp }}/cloudsec-*-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz runtime-sbom.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify candidate license and checksums
        run: python scripts/verify_release_artifacts.py
      - uses: actions/upload-artifact@v7
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist
      - name: Check downloaded candidate checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/runtime-sbom.json
            dist/SHA256SUMS

  publish-stable:
    # The initial stable release is explicitly authorized. Never publish from a PR,
    # a fork, a manual dispatch, or an unverified/rebuilt artifact.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'sm-joe/cloudsec-scanner'
    needs: [package, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cloudsec-stable-v0.1.0
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Check publication state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          # List the specific tag through a successful API request. Authorization
          # and network failures must not be mistaken for "release absent".
          state="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.1.0") | [.draft,.prerelease] | @tsv')"
          if [[ "$state" == $'false\tfalse' ]]; then
            echo "Stable release already exists; no mutation."
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          elif [[ -n "$state" ]]; then
            echo "Existing draft or prerelease requires explicit review." >&2
            exit 1
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.state.outputs.publish == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require exact-main security and portability gates
        if: steps.state.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wait_release_gates.py
      - uses: actions/download-artifact@v7
        if: steps.state.outputs.publish == 'true'
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist
      - name: Verify exact candidate before publishing
        if: steps.state.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_release_artifacts.py
          for artifact in dist/*.whl dist/*.tar.gz dist/runtime-sbom.json dist/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GH_REPO" --source-ref refs/heads/main --source-digest "$RELEASE_SHA" --signer-workflow "$GH_REPO/.github/workflows/release-candidate.yml"
          done
      - name: Publish stable v0.1.0
        if: steps.state.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Only the current main head may publish. Refuse preexisting tags.
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          [[ "$current" == "$RELEASE_SHA" ]]
          refs="$(gh api "repos/$GH_REPO/git/matching-refs/tags/v0.1.0" --jq '.[] | select(.ref == "refs/tags/v0.1.0") | .ref')"
          [[ -z "$refs" ]]
          gh release create v0.1.0 --target "$RELEASE_SHA" --title "CloudSec Scanner v0.1.0" --notes-file docs/releases/v0.1.0.md --latest dist/*.whl dist/*.tar.gz dist/runtime-sbom.json dist/SHA256SUMS
          gh release view v0.1.0 --json tagName,isDraft,isPrerelease,assets,url
