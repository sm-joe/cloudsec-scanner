name: CLI Release Candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build twine cyclonedx-bom pip-audit
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - name: Fresh installation smoke test
        run: python scripts/verify_wheel.py
      - name: Inventory runtime dependencies
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/cloudsec-release"
          "$RUNNER_TEMP/cloudsec-release/bin/python" -m pip install dist/*.whl
          cyclonedx-py environment "$RUNNER_TEMP/cloudsec-release/bin/python" --output-format JSON --output-file dist/runtime-sbom.json
      - name: Audit installed core and AWS runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cloudsec-aws"
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          "$RUNNER_TEMP/cloudsec-aws/bin/python" -m pip install "${wheel}[aws]"
          for profile in cloudsec-release cloudsec-aws; do
            environment="$RUNNER_TEMP/$profile"
            "$environment/bin/python" -m pip check
            # Audit installed dependencies, excluding only the unpublished local
            # project itself. Do not silently skip any third-party package.
            "$environment/bin/python" -m pip list --format=json > "$RUNNER_TEMP/$profile-packages.json"
            python scripts/runtime_requirements.py "$RUNNER_TEMP/$profile-packages.json" > "$RUNNER_TEMP/$profile-requirements.txt"
            pip-audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/$profile-requirements.txt" --format json --output "$RUNNER_TEMP/$profile-audit.json"
          done
      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum *.whl *.tar.gz runtime-sbom.json > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Verify candidate license and checksums
        run: python scripts/verify_release_artifacts.py
      - uses: actions/upload-artifact@v7
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  attest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: cloudsec-release-candidate-${{ github.run_id }}
          path: dist
      - name: Check downloaded candidate checksums
        run: cd dist && sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/runtime-sbom.json
            dist/SHA256SUMS
