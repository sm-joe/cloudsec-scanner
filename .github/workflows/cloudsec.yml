name: Cloud Security Scanner

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  scan:
    name: Test and Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Scanner and Development Dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Lint
        id: lint
        run: ruff check src tests scripts

      - name: Run Tests
        id: tests
        run: python -m pytest -q

      - name: Validate Current Example Policy
        run: python -c "from cloudsec_scanner.config import load_config; load_config('examples/.cloudsec.yml')"

      - name: Create Reports Directory
        run: python -c "from pathlib import Path; Path('reports').mkdir(parents=True, exist_ok=True)"

      - name: Scan Current Revision (JSON)
        id: scan_json
        continue-on-error: true
        run: cloudsec scan . --config .cloudsec-ci.yml --format json --output reports/current.json --no-fail

      - name: Scan Current Revision (SARIF)
        id: scan_sarif
        if: always()
        continue-on-error: true
        run: cloudsec scan . --config .cloudsec-ci.yml --format sarif --output reports/current.sarif --no-fail

      - name: Resolve Baseline Revision
        id: baseline
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          baseline_sha=""
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            baseline_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            baseline_sha="$BEFORE_SHA"
          else
            baseline_sha="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$baseline_sha" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
            echo "Baseline revision: $baseline_sha"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No parent revision is available; regression comparison will be skipped."
          fi

      - name: Checkout Baseline Revision
        id: checkout_baseline
        if: always() && steps.baseline.outputs.available == 'true'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: baseline-repo
          fetch-depth: 1

      - name: Scan Baseline Revision
        id: scan_baseline
        if: always() && steps.baseline.outputs.available == 'true' && steps.checkout_baseline.outcome == 'success'
        continue-on-error: true
        run: cloudsec scan baseline-repo --config .cloudsec-ci.yml --format json --output reports/baseline.json --no-fail

      - name: Compare Baseline with Current Scan
        id: compare
        if: always() && steps.baseline.outputs.available == 'true' && steps.scan_json.outcome == 'success' && steps.scan_baseline.outcome == 'success'
        continue-on-error: true
        run: cloudsec compare reports/baseline.json reports/current.json --format json --output reports/comparison.json

      - name: Enforce Regression Policy (HIGH and CRITICAL)
        id: gate
        if: always() && steps.baseline.outputs.available == 'true' && steps.compare.outcome == 'success'
        continue-on-error: true
        run: python scripts/ci_gate.py reports/comparison.json --severity HIGH

      - name: Publish SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/current.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/current.sarif
          category: cloudsec-scanner

      - name: Upload Scan and Comparison Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudsec-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce Workflow Result
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          SCAN_JSON_OUTCOME: ${{ steps.scan_json.outcome }}
          SCAN_SARIF_OUTCOME: ${{ steps.scan_sarif.outcome }}
          BASELINE_AVAILABLE: ${{ steps.baseline.outputs.available }}
          CHECKOUT_BASELINE_OUTCOME: ${{ steps.checkout_baseline.outcome }}
          SCAN_BASELINE_OUTCOME: ${{ steps.scan_baseline.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          python - <<'PY'
          import os
          import sys

          required = {
              "lint": os.environ.get("LINT_OUTCOME"),
              "tests": os.environ.get("TESTS_OUTCOME"),
              "current JSON scan": os.environ.get("SCAN_JSON_OUTCOME"),
              "current SARIF scan": os.environ.get("SCAN_SARIF_OUTCOME"),
          }
          if os.environ.get("BASELINE_AVAILABLE") == "true":
              required.update({
                  "baseline checkout": os.environ.get("CHECKOUT_BASELINE_OUTCOME"),
                  "baseline scan": os.environ.get("SCAN_BASELINE_OUTCOME"),
                  "report comparison": os.environ.get("COMPARE_OUTCOME"),
                  "regression gate": os.environ.get("GATE_OUTCOME"),
              })
          failed = [name for name, outcome in required.items() if outcome != "success"]
          if failed:
              print("CloudSec CI failed: " + ", ".join(failed), file=sys.stderr)
              raise SystemExit(1)
          print("CloudSec CI checks passed.")
          PY
