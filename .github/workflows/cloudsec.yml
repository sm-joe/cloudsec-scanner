name: Cloud Security Scanner

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    name: Scan infrastructure and configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Cloud Security Scanner
        run: python -m pip install .

      - name: Run scan and write SARIF
        run: cloudsec scan . --format sarif --output cloudsec.sarif --severity HIGH

      - name: Upload SARIF to code scanning
        if: always() && hashFiles('cloudsec.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cloudsec.sarif
