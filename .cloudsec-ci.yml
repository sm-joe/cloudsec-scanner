# CI-specific exclusions for intentionally vulnerable scanner examples and
# generated scan reports. Keep these files available to local scanner tests.
exclude:
  - .git/**
  - .venv/**
  - venv/**
  - node_modules/**
  - dist/**
  - build/**
  - tests/**
  - insecure.tf
  - insecure.yaml
  - reports/**
  - baseline-repo/**
  - comparison-report.json
  - image-report.json
  - image-report-current.json
  - stage2-report.json
  - stage2-reconciled-report.json
