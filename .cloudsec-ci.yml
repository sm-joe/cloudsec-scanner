# CI-specific exclusions for intentionally vulnerable scanner examples and
# generated scan reports. Legacy root fixture exclusions are retained for
# baseline scans of earlier revisions; current fixtures live under tests/.
exclude:
  - .git/**
  - .venv/**
  - venv/**
  - node_modules/**
  - dist/**
  - build/**
  - tests/**
  - insecure.tf
  - insecure.yaml
  - reports/**
  - baseline-repo/**
  - comparison-report.json
  - image-report.json
  - image-report-current.json
